<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Password Manager v2 Icon</title>
  <desc id="desc">A white diamond-shaped vault with an indigo lock on a violet rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="36" y1="26" x2="220" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d63ed"/>
